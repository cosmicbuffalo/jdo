[package]
name = "jdo"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A terminal UI client for Jira boards — a fork of tdo's TUI over the Jira Cloud REST API"
repository = "https://github.com/cosmicbuffalo/jdo"

[dependencies]
# --- TUI (carried over from tdo) ---
ratatui = "0.29"
crossterm = "0.28"
tui-textarea = "0.7"
unicode-width = "0.2"

# --- serialization / config ---
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
clap = { version = "4", features = ["derive", "env"] }
chrono = { version = "0.4", features = ["serde"] }

# --- network (P1) ---
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
base64 = "0.22"

# --- misc ---
anyhow = "1"
shlex = "1"

# Clipboard dep (arboard) is added in P4.
# OAuth deps (oauth2, tiny_http, open) are added in P5.
